<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No color-scheme meta: it can paint an opaque canvas behind the transparent window. -->
  <title>Pady</title>
  <!-- The translation pop-up's card, buttons and colours, plus what's new here. -->
  <link rel="stylesheet" href="translate.css">
  <link rel="stylesheet" href="quick.css">
</head>
<body>
  <main class="card" id="card" tabindex="-1" role="dialog" aria-labelledby="title">
    <header class="head" title="Drag to move">
      <span class="dot" aria-hidden="true"></span>
      <span class="langs" id="title">Clipboard</span>
      <button class="icon-btn" id="close" type="button" aria-label="Close (Esc)" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <section class="quick-body" id="body"></section>
    <footer class="foot" id="foot"></footer>
  </main>
  <script src="quick.js"></script>
</body>
</html>
