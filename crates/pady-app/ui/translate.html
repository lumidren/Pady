<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No color-scheme meta: it can paint an opaque canvas behind the transparent window. -->
  <title>Pady translation</title>
  <link rel="stylesheet" href="translate.css">
</head>
<body>
  <main class="card" id="card" tabindex="-1" role="dialog" aria-labelledby="langs" aria-describedby="body">
    <header class="head">
      <span class="dot" aria-hidden="true"></span>
      <span class="langs" id="langs">Translating…</span>
      <button class="icon-btn" id="close" type="button" aria-label="Close (Esc)" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <section class="body" id="body" aria-live="polite"></section>
    <footer class="foot" id="foot">
      <span class="engine" id="engine"></span>
      <span class="spacer"></span>
      <button class="btn" id="copy" type="button" title="Copy the translation (Ctrl+C)">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
        <span>Copy</span>
      </button>
      <button class="btn btn--primary" id="replace" type="button" title="Put the translation in place of the selected text">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 7h11l-3-3M20 17H9l3 3"/></svg>
        <span>Replace</span>
      </button>
      <button class="btn btn--primary" id="retry" type="button" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg>
        <span>Try again</span>
      </button>
    </footer>
  </main>
  <script src="translate.js"></script>
</body>
</html>
