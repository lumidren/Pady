[package]
name = "pady-app"
description = "Pady desktop app: customise multi-finger touchpad gestures on Windows and Linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pady"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pady-core.workspace = true
pady-input.workspace = true
pady-actions.workspace = true
pady-overlay.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger.workspace = true
dirs.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# Updates ship as a plain setup .exe and AppImage, so the zip feature (and its
# zip/tar/flate2 dependencies) is left out.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-dialog = "2"
# The translator: HTTPS to the translation services (rustls with ring, as
# the updater uses), and offline language detection for the free service.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "form", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
whatlang = "0.16"
# Sends a long text's pieces to the free service side by side.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"]
