[workspace]
resolver = "2"
members = [
    "crates/pady-core",
    "crates/pady-input",
    "crates/pady-actions",
    "crates/pady-cli",
    "crates/pady-app",
    "crates/pady-overlay",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["lumidren"]
license = "MIT"
repository = "https://github.com/lumidren/Pady"
rust-version = "1.82"

[workspace.dependencies]
pady-core = { path = "crates/pady-core" }
pady-input = { path = "crates/pady-input" }
pady-actions = { path = "crates/pady-actions" }
pady-overlay = { path = "crates/pady-overlay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
dirs = "7"
windows = "0.62"
evdev = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
