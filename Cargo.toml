[workspace]
resolver = "2"
members = [
    "crates/pady-core",
    "crates/pady-input",
    "crates/pady-actions",
    "crates/pady-cli",
    "crates/pady-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["lumidren"]
repository = "https://github.com/lumidren/Pady"
rust-version = "1.77"

[workspace.dependencies]
pady-core = { path = "crates/pady-core" }
pady-input = { path = "crates/pady-input" }
pady-actions = { path = "crates/pady-actions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
dirs = "5"
windows = "0.58"
evdev = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
