name: Feature request
description: A gesture, action or setting you'd like Pady to have.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do?
      description: Describe the gesture or workflow. Why does it matter to you?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: dropdown
    id: os
    attributes:
      label: Where do you need it?
      multiple: true
      options: [Windows, Linux]
