name: Release

# Builds every installer. Push a tag like v0.2.0 to attach them to a draft
# GitHub release, or run it by hand (Actions › Release › Run workflow) to get
# them as downloadable artifacts without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis,msi
          - name: linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    env:
      # Code signing turns on by itself once these repository secrets exist.
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf libfuse2

      - name: Import the code-signing certificate
        if: runner.os == 'Windows' && env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $signing = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 -Compress
          "TAURI_SIGNING_CONFIG=$signing" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installers
        working-directory: crates/pady-app
        shell: bash
        run: |
          args=(build --bundles "${{ matrix.bundles }}")
          if [ -n "${TAURI_SIGNING_CONFIG:-}" ]; then args+=(--config "$TAURI_SIGNING_CONFIG"); fi
          npx --yes "$TAURI_CLI" "${args[@]}"

      - name: Build pady-cli
        run: cargo build --release --locked -p pady-cli

      - name: Collect files and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir dist
          for f in target/release/bundle/{nsis,msi,deb,rpm,appimage}/*.{exe,msi,deb,rpm,AppImage}; do
            cp "$f" dist/
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "dist/pady-cli-${version}-windows-x64.zip" ./target/release/pady-cli.exe > /dev/null
          else
            tar -czf "dist/pady-cli-${version}-linux-x64.tar.gz" -C target/release pady-cli
          fi
          (cd dist && sha256sum * > "SHA256SUMS-${{ matrix.name }}.txt")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pady-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
