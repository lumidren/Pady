name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published advisory is caught between releases.
  schedule:
    - cron: "0 6 * * 1"

# Nothing here writes to the repository: the token is read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system libraries (Tauri / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Fails if a key number (allocations per frame, time per frame relative
      # to a yardstick timed in the same run) is over 20% worse than
      # security/perf-baseline.json.
      - name: Performance regression check
        run: cargo test --release -p pady-security --test perf_regression -- --nocapture
      - name: Check UI scripts parse
        run: for f in crates/pady-app/ui/*.js; do node --check "$f"; done
        shell: bash

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-audit --locked
      # Fails on any known vulnerability in Cargo.lock; unmaintained crates only warn.
      - run: cargo audit
