name: Website

# Publishes the site (site/ plus the app UI as a live demo) to GitHub Pages
# whenever it or the UI changes. Needs Settings › Pages › Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "crates/pady-app/ui/**", "docs/**", "scripts/build-site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
